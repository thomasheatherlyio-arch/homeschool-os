<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shiloh HQ Command Center</title>
<style>
:root{
  --bg:#0d1017; --panel:#151a24; --ink:#e9ecf3; --muted:#9aa3b5; --line:#262d3b; --chip:#1d2330;
  --accent:#7d93ff;
  --q-mind:#6f95ff; --q-body:#ff7a5f; --q-venture:#f2b833; --q-spirit:#a88bff; --q-systems:#3fd1a6; --q-personal:#8b93a7;
  --display:"Segoe UI Narrow","Arial Narrow","Franklin Gothic Medium","Trebuchet MS",sans-serif;
  --body:"Segoe UI","Helvetica Neue",system-ui,-apple-system,sans-serif;
  --mono:Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body{padding:28px 20px 64px;padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.wrap{max-width:1160px;margin:0 auto;display:grid;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(2.1rem,5vw,3.2rem);font-weight:700;line-height:1;letter-spacing:.02em}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-bottom:12px}
.kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
header.hero{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:18px}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:140px}
.stat span{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-size:1.25rem;font-weight:700;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.note{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:820px){.row{grid-template-columns:minmax(0,1fr)}}
ol.pri{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ol.pri li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
ol.pri li:last-child{border-bottom:0;padding-bottom:0}
.rank{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--chip);color:var(--accent);border:1px solid var(--line)}
.pri .do{color:var(--muted);font-size:.86rem;margin:2px 0 0}
.badge{font-family:var(--mono);font-size:.7rem;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--chip);white-space:nowrap;align-self:center}
.courses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:960px){.courses{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.courses{grid-template-columns:minmax(0,1fr)}}
.course{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.course h3{font-size:1.02rem;line-height:1.2}
.course .meta{font-size:.8rem;color:var(--muted);margin-top:4px}
.ring{flex:0 0 64px;width:64px;height:64px}
.ring text{font-family:var(--display);font-size:13px;font-weight:700;fill:var(--ink)}
.khan-grid{display:grid;gap:8px;margin-top:8px}
.krow{display:grid;grid-template-columns:minmax(120px,1.1fr) 52px minmax(0,2fr) auto;gap:10px;align-items:center;font-size:.88rem}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--q-mind)}
.krow .goal{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.mins{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.mins .stat{min-width:160px}
.list{display:grid;gap:0}
.list .item{display:grid;grid-template-columns:minmax(0,1.1fr) auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.list .item:last-child{border-bottom:0}
.list .item small{display:block;color:var(--muted);font-size:.8rem}
.gates{display:grid;gap:8px;margin-bottom:12px}
.gate{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:8px 0;border-bottom:1px solid var(--line)}
.gate:last-of-type{border-bottom:0}
.subjects{display:grid;gap:6px}
.sub{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;font-size:.82rem;align-items:center}
.sub .nm{font-weight:600}
.pill{font-family:var(--mono);font-size:.68rem;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.ev{display:flex;gap:14px;flex-wrap:wrap}
.ev .stat b{font-size:1.8rem}
.circle-wrap{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:560px){.circle-wrap{grid-template-columns:minmax(0,1fr)}}
svg.wheel{width:100%;max-width:160px;margin:0 auto;display:block}
.qleg{display:grid;gap:7px}
.qleg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.86rem}
.sw{width:12px;height:12px;border-radius:3px}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:800px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.strip{grid-template-columns:minmax(0,1fr)}}
.day{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.day h3{font-size:.95rem;margin-bottom:8px}
.blk{border-left:3px solid var(--line);padding:4px 0 4px 8px;margin:0 0 6px;font-size:.78rem}
.blk .t{font-family:var(--mono);font-size:.66rem;color:var(--muted);display:block}
.blk.mind{border-color:var(--q-mind)}
.blk.body{border-color:var(--q-body)}
.blk.venture{border-color:var(--q-venture)}
.blk.spirit{border-color:var(--q-spirit)}
.blk.systems{border-color:var(--q-systems)}
.blk.personal{border-color:var(--q-personal)}
footer.foot{color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);padding-top:14px}
footer.foot strong{color:var(--ink);font-weight:600}
</style>
</head>

<script>
(function(){
  const data = JSON.parse(document.getElementById("hq-data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const dash = (v) => (v === null || v === undefined || v === "" || v === "None") ? "—" : String(v);

  function fmtWeek(iso){
    if(!iso) return "—";
    const [y,m,d] = iso.split("-").map(Number);
    const dt = new Date(y, m-1, d);
    return dt.toLocaleDateString("en-US",{month:"short", day:"numeric", year:"numeric"});
  }

  function ring(pct, color){
    const r=26, c=2*Math.PI*r;
    const known = (typeof pct === "number" && !isNaN(pct));
    const val = known ? Math.max(0, Math.min(100, pct)) : 0;
    const off = c - (val/100)*c;
    const label = known ? (Math.round(val)+"%") : "—";
    return `<svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--chip)" stroke-width="6"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color||"var(--q-mind)"}" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"
        transform="rotate(-90 32 32)"/>
      <text x="32" y="36" text-anchor="middle">${esc(label)}</text>
    </svg>`;
  }

  const qColor = {mind:"var(--q-mind)",body:"var(--q-body)",venture:"var(--q-venture)",spirit:"var(--q-spirit)",systems:"var(--q-systems)"};

  $("header-stats").innerHTML = `
    <div class="stat"><span>Week of</span><b>${esc(fmtWeek(data.weekOf))}</b></div>
    <div class="stat"><span>Khan streak</span><b>${data.streakWeeks != null ? esc(data.streakWeeks)+" weeks" : "—"}</b></div>
    <div class="stat"><span>To Fall 2027</span><b>${data.weeksToFall2027 != null ? "≈ "+esc(data.weeksToFall2027)+" weeks" : "—"}</b></div>
  `;

  const pri = data.priorities || [];
  $("priorities").innerHTML = `<h2>Top priorities this week</h2>
    <ol class="pri">${pri.map(p => `<li>
      <div class="rank">${esc(p.rank)}</div>
      <div><strong>${esc(p.item)}</strong><div class="do">${esc(p.do)}</div></div>
      <span class="badge">${esc(p.priority)}</span>
    </li>`).join("")}</ol>
    ${data.prioritiesNote ? `<p class="note">${esc(data.prioritiesNote)}</p>` : ""}`;

  const courses = data.courses || [];
  $("courses-sec").innerHTML = `<h2>Courses</h2>
    <div class="courses">${courses.map(c => `<article class="course">
      ${ring(c.pct, qColor[c.quadrant])}
      <div>
        <h3>${esc(c.name)}</h3>
        <div class="meta">${esc(c.status)} · ${esc(dash(c.progress))}${c.interest ? " · interest "+esc(c.interest)+" · priority "+esc(c.priority) : ""}</div>
        <div class="meta">${esc(c.next||"")}</div>
      </div>
    </article>`).join("")}</div>`;

  const k = data.khan || {};
  const kcs = k.courses || [];
  $("khan").innerHTML = `<h2>Khan Academy</h2>
    <div class="mins">
      <div class="stat"><span>Last synced</span><b>${esc(dash(k.lastSync))}</b></div>
      <div class="stat"><span>Minutes (last window)</span><b>${k.thisWeekMinutes != null ? esc(k.thisWeekMinutes)+" min" : "—"}</b></div>
      <div class="stat"><span>Weekly goal</span><b>${k.weeklyGoal != null ? esc(k.weeklyGoal)+" min" : "—"}</b></div>
    </div>
    <div class="khan-grid">${kcs.map(c => {
      const known = typeof c.mastery === "number";
      const w = known ? Math.max(0, Math.min(100, c.mastery)) : 0;
      const label = known ? c.mastery+"%" : dash(c.label || null);
      return `<div class="krow">
        <div>${esc(c.name)}</div>
        <div>${esc(label)}</div>
        <div class="bar" aria-hidden="true"><span style="width:${w}%"></span></div>
        <div class="goal">${esc(c.goal || "—")}</div>
      </div>`;
    }).join("")}</div>
    <p class="note">${esc(k.weeklyGoalNote||"")} ${k.thisWeekRange ? "Window: "+esc(k.thisWeekRange)+"." : ""} Figures are pending until Dad verifies.</p>`;

  const projects = data.projects || [];
  $("projects").innerHTML = `<h2>Projects &amp; tasks</h2>
    <div class="list">${projects.map(p => `<div class="item">
      <div><strong>${esc(p.name)}</strong><small>${esc(p.status)} · ${esc(dash(p.progress))}</small></div>
      <small>${esc(p.next||"")}</small>
    </div>`).join("")}</div>`;

  const r = data.readiness || {};
  const g2 = r.gate2 || {};
  $("readiness").innerHTML = `<h2>Readiness gates</h2>
    <div class="gates">
      <div class="gate"><span>Overall</span><strong>${esc(dash(r.overall))}</strong></div>
      <div class="gate"><span>9th-grade start</span><strong>${esc(dash(r.targetStart))}</strong></div>
      <div class="gate"><span>Gate 2 (week of ${esc(dash(g2.weekOf))})</span><strong>missions ${esc(dash(g2.missions))} · notes ${esc(dash(g2.dailyNotes))} · review ${esc(dash(g2.fridayReview))}</strong></div>
      <div class="gate"><span>Gate 3 credits</span><strong>${esc(dash(r.gate3Credits))}</strong></div>
    </div>
    <div class="subjects">${(r.subjects||[]).map(s => `<div class="sub">
      <span class="nm">${esc(s.name)}</span>
      <span class="pill">${esc(s.status||"—")}</span>
      <span class="pill">✔ ${esc(s.verified)} / ⏳ ${esc(s.pending)}</span>
    </div>`).join("")}</div>
    <p class="note">Verified work is what counts. Pending figures are claimed, not done.</p>`;

  const ev = data.evidence || {};
  $("evidence").innerHTML = `<h2>Evidence</h2>
    <div class="ev">
      <div class="stat"><span>Pending</span><b>${esc(dash(ev.pending))}</b></div>
      <div class="stat"><span>Verified</span><b>${esc(dash(ev.verified))}</b></div>
    </div>
    <p class="note">${esc(ev.note||"")}</p>`;

  const circ = data.circle || {};
  const scores = circ.scores || {};
  const labels = {mind:"Mind",body:"Body",venture:"Venture",spirit:"Spirit",systems:"Systems"};
  const colors = {mind:"#6f95ff",body:"#ff7a5f",venture:"#f2b833",spirit:"#a88bff",systems:"#3fd1a6"};
  const order = ["mind","body","venture","spirit","systems"];
  // 5-slice wheel
  const cx=80, cy=80, r0=28, r1=74;
  let paths="", ang=-Math.PI/2, slice=2*Math.PI/5;
  order.forEach((k,i) => {
    const a0=ang, a1=ang+slice;
    const p = (r,a)=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
    const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
    paths += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r1} ${r1} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)} A${r0} ${r0} 0 0 0 ${x3.toFixed(1)} ${y3.toFixed(1)} Z" fill="${colors[k]}" opacity="0.92"/>`;
    ang=a1;
  });
  $("circle").innerHTML = `<h2>Circle balance</h2>
    <div class="circle-wrap">
      <svg class="wheel" viewBox="0 0 160 160" role="img" aria-label="Circle quadrants">${paths}</svg>
      <div class="qleg">${order.map(k => {
        const sc = scores[k];
        const mins = (circ.templateMinutes||{})[k];
        return `<div><span class="sw" style="background:${colors[k]}"></span><span>${labels[k]}</span><span>${dash(sc)}${mins ? " · "+mins+" min (template)" : ""}</span></div>`;
      }).join("")}</div>
    </div>
    <p class="note">${esc(circ.scoresNote||"")}</p>`;

  const sch = data.schedule || {};
  const days = sch.days || {};
  $("schedule").innerHTML = `<h2>This week's schedule</h2>
    <p class="note" style="margin-top:0;margin-bottom:12px">Day starts at <strong>${esc(dash(sch.dayStart))}</strong>. Times are <strong>draft</strong> until Shiloh and Dad approve. Khan sitting lengths are approved. Calendar to mirror: <strong>${esc(sch.calendarName||"—")}</strong> — ${esc(sch.calendarNote||"")}</p>
    <div class="strip">${["Mon","Tue","Wed","Thu","Fri"].map(d => {
      const blks = days[d] || [];
      return `<div class="day"><h3>${d}</h3>${blks.map(b => `<div class="blk ${esc(b.kind||"")}"><span class="t">${esc(b.time)}</span>${esc(b.name)}</div>`).join("")}</div>`;
    }).join("")}</div>`;

  $("foot").innerHTML = `Generated ${esc(dash(data.generated))} (${esc(data.timezone||"America/Chicago")}) from <strong>status-tracker</strong>, the Khan dashboard, and the project board. Missing figures show as —. COLT never invents numbers. Work counts once Dad verifies it.`;
})();
</script>
